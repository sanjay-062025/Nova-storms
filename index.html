    <script>
      // Suppress benign [vite] websocket connection warnings and expected permission dismissals in AI Studio preview environment
      (function() {
        function isBenignMsg(args) {
          if (!args) return false;
          for (var i = 0; i < args.length; i++) {
            var a = args[i];
            if (!a) continue;
            var str = typeof a === 'string' ? a : (a.message || (typeof a === 'object' ? (a.stack || String(a)) : String(a)));
            if (str && (
              str.indexOf('[vite]') !== -1 ||
              str.indexOf('failed to connect to websocket') !== -1 ||
              str.indexOf('WebSocket connection') !== -1 ||
              str.indexOf('Permission dismissed') !== -1 ||
              str.indexOf('Camera access failed') !== -1 ||
              str.indexOf('Permission denied') !== -1 ||
              str.indexOf('NotAllowedError') !== -1
            )) {
              return true;
            }
          }
          return false;
        }
        ['error', 'warn', 'info', 'log', 'debug'].forEach(function(fn) {
          var orig = console[fn];
          if (typeof orig === 'function') {
            console[fn] = function() {
              if (isBenignMsg(arguments)) {
                if (fn === 'error') {
                  console.info.apply(console, arguments);
                  return;
                }
                return;
              }
              orig.apply(console, arguments);
            };
          }
        });
        window.addEventListener('error', function(e) {
          var msg = (e && (e.message || '')) || '';
          if (
            msg.indexOf('[vite]') !== -1 ||
            msg.indexOf('WebSocket') !== -1 ||
            msg.indexOf('Permission dismissed') !== -1 ||
            msg.indexOf('Camera access') !== -1 ||
            msg.indexOf('NotAllowedError') !== -1 ||
            (e && e.filename && e.filename.indexOf('vite') !== -1)
          ) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);
        window.addEventListener('unhandledrejection', function(e) {
          var reason = e && e.reason;
          var msg = reason ? (reason.message || (typeof reason === 'object' ? (reason.stack || String(reason)) : String(reason))) : '';
          if (
            msg.indexOf('[vite]') !== -1 ||
            msg.indexOf('WebSocket') !== -1 ||
            msg.indexOf('Permission dismissed') !== -1 ||
            msg.indexOf('Camera access') !== -1 ||
            msg.indexOf('NotAllowedError') !== -1
          ) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);
      })();
    </script>
